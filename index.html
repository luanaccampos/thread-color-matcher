// ===================== UTIL =====================
function hexToRgb(hex) {
  hex = hex.replace("#", "");

  if (hex.length === 3) {
    hex = hex.split("").map(c => c + c).join("");
  }

  const num = parseInt(hex, 16);

  return {
    r: (num >> 16) & 255,
    g: (num >> 8) & 255,
    b: num & 255
  };
}

function rgbToLab(r, g, b) {
  r /= 255; g /= 255; b /= 255;

  [r, g, b] = [r, g, b].map(v =>
    v > 0.04045 ? Math.pow((v + 0.055)/1.055, 2.4) : v / 12.92
  );

  let x = (r*0.4124 + g*0.3576 + b*0.1805) / 0.95047;
  let y = (r*0.2126 + g*0.7152 + b*0.0722);
  let z = (r*0.0193 + g*0.1192 + b*0.9505) / 1.08883;

  [x, y, z] = [x, y, z].map(v =>
    v > 0.008856 ? Math.pow(v, 1/3) : (7.787*v + 16/116)
  );

  return {
    L: (116*y - 16),
    a: 500*(x - y),
    b: 200*(y - z)
  };
}

function deltaE(lab1, lab2) {
  const L1 = lab1.L, a1 = lab1.a, b1 = lab1.b;
  const L2 = lab2.L, a2 = lab2.a, b2 = lab2.b;

  const avgLp = (L1 + L2) / 2;
  const C1 = Math.sqrt(a1*a1 + b1*b1);
  const C2 = Math.sqrt(a2*a2 + b2*b2);
  const avgC = (C1 + C2) / 2;

  const G = 0.5 * (1 - Math.sqrt(Math.pow(avgC, 7) / (Math.pow(avgC, 7) + Math.pow(25, 7))));

  const a1p = (1 + G) * a1;
  const a2p = (1 + G) * a2;

  const C1p = Math.sqrt(a1p*a1p + b1*b1);
  const C2p = Math.sqrt(a2p*a2p + b2*b2);

  const avgCp = (C1p + C2p) / 2;

  const h1p = Math.atan2(b1, a1p) >= 0 ? Math.atan2(b1, a1p) : Math.atan2(b1, a1p) + 2*Math.PI;
  const h2p = Math.atan2(b2, a2p) >= 0 ? Math.atan2(b2, a2p) : Math.atan2(b2, a2p) + 2*Math.PI;

  let deltahp;
  if (Math.abs(h1p - h2p) <= Math.PI) {
    deltahp = h2p - h1p;
  } else {
    deltahp = h2p <= h1p ? h2p - h1p + 2*Math.PI : h2p - h1p - 2*Math.PI;
  }

  const deltaLp = L2 - L1;
  const deltaCp = C2p - C1p;
  const deltaHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(deltahp / 2);

  const avgHp = Math.abs(h1p - h2p) > Math.PI
    ? (h1p + h2p + 2*Math.PI) / 2
    : (h1p + h2p) / 2;

  const T = 1
    - 0.17 * Math.cos(avgHp - Math.PI/6)
    + 0.24 * Math.cos(2 * avgHp)
    + 0.32 * Math.cos(3 * avgHp + Math.PI/30)
    - 0.20 * Math.cos(4 * avgHp - 63 * Math.PI/180);

  const SL = 1 + ((0.015 * Math.pow(avgLp - 50, 2)) / Math.sqrt(20 + Math.pow(avgLp - 50, 2)));
  const SC = 1 + 0.045 * avgCp;
  const SH = 1 + 0.015 * avgCp * T;

  const deltaTheta = 30 * Math.PI/180 * Math.exp(-Math.pow((avgHp * 180/Math.PI - 275)/25, 2));
  const RC = 2 * Math.sqrt(Math.pow(avgCp, 7) / (Math.pow(avgCp, 7) + Math.pow(25, 7)));
  const RT = -RC * Math.sin(2 * deltaTheta);

  return Math.sqrt(
    Math.pow(deltaLp / SL, 2) +
    Math.pow(deltaCp / SC, 2) +
    Math.pow(deltaHp / SH, 2) +
    RT * (deltaCp / SC) * (deltaHp / SH)
  );
}

linhas.forEach(l => {
  const rgb = hexToRgb(l.hex);
  l.rgb = rgb;
  l.lab = rgbToLab(rgb.r, rgb.g, rgb.b);
});

// ===================== COLOR PICKER =====================
const colorPicker = document.getElementById("colorPicker");
const hexInput = document.getElementById("hex");

colorPicker.addEventListener("input", () => {
  hexInput.value = colorPicker.value;
  buscar();
});

hexInput.addEventListener("input", () => {
  let val = hexInput.value.trim();

  if (!val.startsWith("#")) val = "#" + val;

  if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
    colorPicker.value = val;
  }
});

// ===================== BUSCA =====================
function buscar() {

  let hex = hexInput.value.trim();

  if (!hex.startsWith("#")) hex = "#" + hex;

  if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) return;

  const rgb = hexToRgb(hex);
  const alvoLab = rgbToLab(rgb.r, rgb.g, rgb.b);

  document.getElementById("preview").style.background = hex;

  const resultados = linhas.map(l => ({
    ...l,
    dist: deltaE(alvoLab, l.lab)
  }));

  resultados.sort((a,b) => a.dist - b.dist);

  mostrar(resultados.slice(0, 10));
}

// ===================== RENDER =====================
function mostrar(lista) {

  const div = document.getElementById("resultados");
  div.innerHTML = "";

  lista.forEach(l => {

    const el = document.createElement("div");
    el.className = "result";

    el.innerHTML = `
      <div class="color-box" style="background:${l.hex}"></div>
      <strong>${l.id}</strong>
      &nbsp; | ${l.hex}
      &nbsp; | ΔE₀₀: ${l.dist.toFixed(2)}
    `;

    div.appendChild(el);
  });
}

// Rodar ao abrir
buscar();
